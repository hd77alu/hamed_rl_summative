[project]
name = "fireshield"
version = "0.1.0"
description = "FireShield: an autonomous wildfire response drone trained with DQN, REINFORCE, PPO, and A2C in TorchRL"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "gymnasium>=0.29.1",
    "torch>=2.2.0",
    "torchrl>=0.4.0",
    "tensordict>=0.4.0",
    "pygame>=2.5.2",
    "numpy>=1.26.0,<2.0.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pandas>=2.2.0",
    "scipy>=1.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
fireshield = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["environment", "training", "integration"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
